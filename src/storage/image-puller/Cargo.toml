[package]
name = "image-puller"
version = "3.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.32", features = ["full"] }
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.27", features = ["user", "mount", "process", "sched"] }
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"

# Internal dependencies
oci-registry-rs = { path = "../oci-registry-rs" }
image-store-rs = { path = "../image-store-rs" }
