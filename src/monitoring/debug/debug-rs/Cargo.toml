[package]
name = "phantom-debug"
version = "3.1.0"
edition = "2021"
description = "Debug and monitoring utilities for Phantom Fragment"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
nix = { version = "0.27", features = ["process", "signal", "fs"] }
procfs = "0.16"
sys-info = "0.9"
libc = "0.2"
tempfile = "3.8"
uuid = { version = "1.0", features = ["v4"] }
num_cpus = "1.16"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"